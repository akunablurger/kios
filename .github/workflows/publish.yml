name: Tidecoin Kiosk - 5 Emulator Matrix

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tidecoin-kiosk-emulators
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-kiosk:
    name: Emulator ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        device: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tidecoin-kiosk-apk-${{ matrix.device }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM if available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM unavailable; emulator will use software acceleration."
          fi

      - name: Run Kiosk on Emulator ${{ matrix.device }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096 -netdelay none -netspeed full
          script: |
            mkdir -p diagnostics
            adb shell settings put global airplane_mode_on 0
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state false || true
            adb shell svc wifi enable
            adb shell svc data enable || true
            sleep 10
            adb shell ping -c 1 -W 5 tidecoinweb.vercel.app > diagnostics/network-check.txt 2>&1 || true

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tidecoin.kiosk/.MainActivity

            echo "Emulator ${{ matrix.device }}: wait for pinning dialog"
            sleep 5
            adb shell input tap 1865 875

            echo "Wait 45 seconds for website to load"
            sleep 45

            adb shell pidof com.tidecoin.kiosk > diagnostics/process-start.txt
            adb shell screencap -p /sdcard/kiosk-start.png
            adb pull /sdcard/kiosk-start.png diagnostics/kiosk-start.png
            adb logcat -d -v time > diagnostics/logcat-start.txt

            echo "Keep app open for about 5h45m"
            sleep 20700

            adb shell pidof com.tidecoin.kiosk > diagnostics/process-end.txt
            adb shell screencap -p /sdcard/kiosk-end.png
            adb pull /sdcard/kiosk-end.png diagnostics/kiosk-end.png
            adb logcat -d -v time > diagnostics/logcat-end.txt

            grep -iE 'KiosWebView|chromium|WebView|tidecoinweb|net::|SSL' \
              diagnostics/logcat-end.txt > diagnostics/webview-errors.txt || true

            test -s diagnostics/process-end.txt

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidecoin-kiosk-diagnostics-${{ matrix.device }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
