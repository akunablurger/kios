name: Tidecoin Kiosk - Build & Run Emulator (5 parallel)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ai-studio-five-email-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  visit:
    name: email-${{ matrix.email_index }}-5-tabs
    runs-on: ubuntu-latest
    timeout-minutes: 390          # 6 jam + buffer

    strategy:
      fail-fast: false
      matrix:
        email_index: [1, 2, 3, 4, 5]
      max-parallel: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper (jika belum ada)
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew tidak ditemukan → generate sekarang..."
            gradle wrapper --gradle-version 8.9
          else
            echo "gradlew sudah ada"
          fi
          chmod +x ./gradlew

      - name: Fix gradle.properties (AndroidX)
        run: |
          cat > gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

      - name: Fix AndroidManifest (hilangkan ic_launcher yang tidak ada)
        run: |
          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher_round"//g' app/src/main/AndroidManifest.xml

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidecoin-kiosk-apk-${{ matrix.email_index }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run on Emulator (Install + Launch + Keep Alive 6 hours)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            echo "=== [Runner ${{ matrix.email_index }}] Install APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "=== [Runner ${{ matrix.email_index }}] Launch Kiosk ==="
            adb shell am start -n com.tidecoin.kiosk/.MainActivity

            echo "=== App akan tetap hidup selama 6 jam (21600 detik) ==="
            sleep 21600

            echo "=== Cek process masih hidup setelah 6 jam ==="
            adb shell pidof com.tidecoin.kiosk || (echo "App crashed on runner ${{ matrix.email_index }}!" && exit 1)

            echo "=== Ambil screenshot terakhir ==="
            adb shell screencap -p /sdcard/kiosk-${{ matrix.email_index }}.png
            adb pull /sdcard/kiosk-${{ matrix.email_index }}.png || true

            echo "=== Berhasil: App sudah jalan 6 jam di emulator (runner ${{ matrix.email_index }}) ==="
