name: Tidecoin Kiosk - Build, Run, and Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tidecoin-kiosk-emulator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-kiosk:
    name: Build and keep Kiosk open
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tidecoin-kiosk-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run Kiosk in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            mkdir -p diagnostics

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tidecoin.kiosk/.MainActivity

            echo "Tunggu dialog pinning Android"
            sleep 5
            adb shell input tap 1865 875

            echo "Tunggu 45 detik agar website dimuat"
            sleep 45

            adb shell pidof com.tidecoin.kiosk > diagnostics/process-start.txt
            adb shell screencap -p /sdcard/kiosk-start.png
            adb pull /sdcard/kiosk-start.png diagnostics/kiosk-start.png
            adb logcat -d -v time > diagnostics/logcat-start.txt

            echo "Kiosk tetap berjalan sekitar 5 jam 45 menit"
            sleep 20700

            adb shell pidof com.tidecoin.kiosk > diagnostics/process-end.txt
            adb shell screencap -p /sdcard/kiosk-end.png
            adb pull /sdcard/kiosk-end.png diagnostics/kiosk-end.png
            adb logcat -d -v time > diagnostics/logcat-end.txt

            grep -iE 'KiosWebView|chromium|WebView|tidecoinweb|net::|SSL' diagnostics/logcat-end.txt > diagnostics/webview-errors.txt || true

            test -s diagnostics/process-end.txt

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidecoin-kiosk-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
