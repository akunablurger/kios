name: Tidecoin Kiosk - Build & Run Emulator (5 parallel)

on:
  schedule:
    # GitHub Actions menggunakan UTC.
    # Berjalan setiap 6 jam.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: five-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  visit:
    name: ${{ matrix.email_index }}-5-tabs
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        email_index: [1, 2, 3, 4, 5]
      max-parallel: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidecoin-kiosk-apk-${{ matrix.email_index }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run on Emulator (Install + Launch + Check)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            echo "=== [Runner ${{ matrix.email_index }}] Install APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "=== [Runner ${{ matrix.email_index }}] Launch Kiosk ==="
            adb shell am start -n com.tidecoin.kiosk/.MainActivity

            echo "=== Tunggu 25 detik biar page load ==="
            sleep 25

            echo "=== Cek process masih hidup ==="
            adb shell pidof com.tidecoin.kiosk || (echo "App crashed on runner ${{ matrix.email_index }}!" && exit 1)

            echo "=== Ambil screenshot ==="
            adb shell screencap -p /sdcard/kiosk-${{ matrix.email_index }}.png
            adb pull /sdcard/kiosk-${{ matrix.email_index }}.png || true

            echo "=== Berhasil: App jalan di emulator (runner ${{ matrix.email_index }}) ==="
